<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LiteLLM Analytics Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="brand-header">
                <div class="brand-badge">LiteLLM Proxy</div>
                <h1 class="brand-title">Analytics Dashboard</h1>
                <p class="brand-subtitle">Enter your user credentials and API key to access model consumption & daily token analytics.</p>
            </div>

            {% if error %}
            <div class="error-alert">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/login" method="POST">
                <div class="form-group">
                    <label class="form-label" for="username">Username / User ID</label>
                    <input type="text" id="username" name="username" class="form-input" placeholder="e.g. alice@example.com" required value="{{ username or '' }}">
                </div>

                <div class="form-group">
                    <label class="form-label" for="api_key">LiteLLM API Key</label>
                    <input type="password" id="api_key" name="api_key" class="form-input" placeholder="sk-..." required>
                </div>

                <button type="submit" class="btn-primary">
                    <span>Authenticate & Access Dashboard</span>
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                    </svg>
                </button>
            </form>
        </div>
    </div>
</body>
</html>
